name: deploy-blog

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout blog content
        uses: actions/checkout@v4
        with:
          path: blog

      - name: Checkout Cyanote Lite engine
        uses: actions/checkout@v4
        with:
          repository: Lyrissonare/Cyanote_Lite
          ref: main
          path: engine

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf engine/content
          cp -R blog/content engine/content
          node engine/build.mjs
          mkdir -p site
          cp engine/index.html engine/LICENSE engine/.nojekyll site/
          cp -R engine/css engine/js engine/vendor engine/content engine/assets site/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
